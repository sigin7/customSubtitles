name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'The tag must match package.json.' }
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build bundled Windows installer
        run: ./scripts/build-windows.ps1
      - name: Test the installed application
        run: |
          $installer = (Get-ChildItem dist/*-Setup-x64.exe).FullName
          ./scripts/smoke-installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: custom-subtitles-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/* --repo $env:GITHUB_REPOSITORY --verify-tag --title "Custom Subtitles $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
